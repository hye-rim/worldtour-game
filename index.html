<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>세계 일주 보드게임</title>
<style>
  /* 아이폰 사파리: 버튼을 누르다 글자가 선택되거나 길게 눌러 복사 메뉴가 뜨지 않게 */
  *, *::before, *::after { -webkit-user-select:none; user-select:none; -webkit-touch-callout:none; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#06101a;
    font-family:-apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; color:#fff;
    touch-action:none;
  }
  #stage { width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:6px 8px; }
  #wrap { position:relative; background:#000; }
  #game { display:block; touch-action:none; image-rendering:pixelated; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; padding:14px; background:rgba(0,0,0,.82); }
  #overlay.hidden { display:none; }
  #overlay h1 { font-size:46px; font-weight:900; letter-spacing:.06em; color:#7fd8ff; text-shadow:0 3px 0 #1a5a8a; }
  #overlay h2 { font-size:24px; font-weight:900; }
  #overlay p { font-size:13px; color:#e6e6e6; line-height:1.6; }
  #overlay .big { font-size:18px; font-weight:800; color:#ffd23a; }
  #overlay .help { font-size:12px; color:#bdbdbd; line-height:1.7; }
  #overlay button { margin-top:6px; background:linear-gradient(180deg,#d0f0ff,#4ab0e8); color:#00243d; font-weight:900; font-size:17px; border:none; border-radius:999px; padding:12px 34px; box-shadow:0 4px 0 #1a5a8a; cursor:pointer; }
  #overlay button:active { transform:translateY(3px); box-shadow:0 1px 0 #1a5a8a; }
  #overlay .lv { display:flex; gap:10px; margin-top:6px; }
  #overlay .lv button { margin-top:0; padding:10px 18px; font-size:16px; }
  #overlay .lv small { display:block; font-size:10px; font-weight:600; opacity:.75; margin-top:2px; }
  #overlay .note { font-size:11px; color:#aab; }
  #top { position:absolute; right:3px; top:2px; display:flex; gap:6px; z-index:2; }
  #top button { position:relative; background:rgba(0,0,0,.55); border:1px solid rgba(255,255,255,.25); color:#fff; width:30px; height:30px; border-radius:8px; font-size:13px; cursor:pointer; }
  #top button::after { content:''; position:absolute; inset:-7px -4px; }
  /* 조작판: 큰 버튼 하나와 보조 버튼 둘 */
  #controls { display:flex; width:100%; max-width:420px; flex-direction:column; justify-content:center; gap:6px; height:142px; }
  #controls .row { display:flex; gap:8px; justify-content:center; }
  #controls button { flex:1; height:50px; border-radius:14px; border:2px solid rgba(255,255,255,.25); background:rgba(255,255,255,.1); color:#fff; font-size:15px; font-weight:800; touch-action:manipulation; }
  #controls button small { display:block; font-size:11px; font-weight:600; opacity:.85; }
  #controls button:disabled { opacity:.35; }
  #btnMain { flex:2; background:linear-gradient(180deg,#8ad8ff,#2a8ad8); height:56px; }
  #btnSecond { background:linear-gradient(180deg,#ffd98a,#d89a2a); color:#2a1a00; }
  #btnThird { background:linear-gradient(180deg,#c8a0ff,#7a4ac4); }
  #controls .hint { text-align:center; font-size:12px; color:#9ecfe8; min-height:16px; }
  .hidden { display:none !important; }
  #top { position:fixed; right:6px; top:4px; }
  #overlay .lv { display:flex; gap:10px; margin-top:6px; }
  #overlay .lv button { margin-top:0; padding:10px 18px; font-size:16px; }
  #overlay .lv small { display:block; font-size:10px; font-weight:600; opacity:.75; margin-top:2px; }
  #overlay .note { font-size:11px; color:#aab; }
  .pc { display:inline; } .touch { display:none; }
  @media (pointer:coarse) { .pc { display:none; } .touch { display:inline; } }
</style>
</head>
<body>
<div id="stage">
  <div id="wrap">
    <canvas id="game"></canvas>
    <div id="top">
      <button id="muteBtn" title="소리 (M)">🔊</button>
      <button id="pauseBtn" title="일시정지 (P)">⏸</button>
    </div>
    <div id="overlay">
      <h1>세계 일주<br>보드게임</h1>
      <p>주사위를 굴려 도시를 사고 건물을 지어요! 🌏<br>다른 사람이 내 땅에 오면 통행료를 받아요. 칩은 게임용이에요</p>
      <div class="help">
        <span class="pc">⌨️ Space/Enter 굴리기·확인 · N 건너뛰기 · 우주여행은 가고 싶은 칸을 눌러요</span>
        <span class="touch">👆 아래 버튼으로 굴리고 사고 지어요</span>
      </div>
      <div class="lv"><button id="startBtn" data-level="easy">쉬움<small>컴퓨터가 소극적이에요</small></button><button id="startBtn2" data-level="normal">보통<small>컴퓨터가 적극적이에요</small></button></div>
    </div>
  </div>
  <div id="controls">
    <div class="hint" id="hint"></div>
    <div class="row"><button id="btnMain">주사위 굴리기</button></div>
    <div class="row"><button id="btnSecond" class="hidden"></button><button id="btnThird" class="hidden"></button></div>
  </div>
</div>
<script src="logic.js"></script>
<script src="game.js"></script>
</body>
</html>
